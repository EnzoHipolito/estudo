<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style.cad.css">
    <script src="../js/cad_veiculo.js"defer></script>
    <title>Cadastro de agendamento</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Voltar para o menu</a>
        </nav>
        <br><br>
    </header>
    <main>
        <form>
            <label for="modelo">Escolha o modelo do veiculo:</label>
            <input type="text" id="modelo">
            <label for="marca">Digite a marca do veiculo:</label>
            <input type="text" id="marca">
            <label for="placa">Digite a placa do veiculo:</label>
            <input type="text" id="placa">
            <label for="codCliente">Digite o codigo do Cliente:</label>
            <input type="number" id="codCliente">
    
            <button id="btn_cadastrar">Cadastrar Agendamento</button>
            <div id="res"></div>
        </form>
    </main>
</body>
</html>
