<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style.cad.css">
    <script src="../js/atuali_cliente.js"defer></script>
    <title>Cadastro de clientes</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Voltar para o menu</a>
        </nav>
        <br><br>
    </header>
    <main>
        <form>
            <label for="nome">Digite o novo nome:</label>
            <input type="text" id="nome">
            <label for="email">Digite o novo email:</label>
            <input type="text" id="email">
            <label for="senha">Digite a novo senha:</label>
            <input type="text" id="senha">
            <label for="cpf">Digite o novo cpf:</label>
            <input type="text" id="cpf">
            <label for="endereco">Digite o novo endereco:</label>
            <input type="text" id="endereco">
            <label for="telefone">Digite o novo telefone:</label>
            <input type="text" id="telefone"><br>
            
            <label for="codCliente">Digite o codigo do cliente:</label>
            <input type="text" id="codCliente">
    
            <button id="btn_atualizar">Atualizar Cliente</button>
            <div id="res"></div>
        </form>
    </main>
</body>
</html>
