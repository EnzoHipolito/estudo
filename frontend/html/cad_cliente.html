<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/style.cad.css">
    <script src="../js/cad_cliente.js"defer></script>
    <title>Cadastro de clientes</title>
</head>
<body>
    <header>
        <nav>
            <a href="../index.html">Voltar para o menu</a>
        </nav>
        <br><br>
    </header>
    <main>
        <form>
            <label for="nome">Digite seu nome:</label>
            <input type="text" id="nome">
            <label for="email">Digite seu email:</label>
            <input type="text" id="email">
            <label for="senha">Digite sua senha:</label>
            <input type="password" id="senha">
            <label for="cpf">Digite seu cpf:</label>
            <input type="text" id="cpf">
            <label for="endereco">Digite seu endereco:</label>
            <input type="text" id="endereco">
            <label for="telefone">Digite seu telefone:</label>
            <input type="text" id="telefone">
    
            <button id="btn_cadastrar">Cadastrar Cliente</button>
            <div id="res"></div>
        </form>
    </main>
</body>
</html>
